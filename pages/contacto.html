<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto | TechStore - Componentes de PC</title>
</head>

<body>
    <header>
        <div class="div-logo">
            <a class="logo" href="../index.html">
                <img src="../img/logo.png" alt="Logo TechStore" />
            </a>
        </div>

        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./resenas.html">Reseñas</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto">
            <h1 class="titulo-contacto text-secondary">Contactanos</h1>

            <form class="form-contacto" action="https://formspree.io/f/mvkzavne" method="POST" autocomplete="off">

                <div class="grupo-input">
                    <label for="nombre">Nombres y Apellidos:</label>
                    <input id="nombre" type="text" name="nombre" autocomplete="off" />
                </div>

                <div class="grupo-input">
                    <label for="email">Correo electrónico:</label>
                    <input id="email" type="email" name="email" autocomplete="off" />
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Tu mensaje:</label>
                    <textarea id="mensaje" name="mensaje" autocomplete="off"></textarea>
                </div>

                <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
            </form>
        </section>

        <section class="mapa">
            <h2 class="text-secondary">Nuestra ubicación</h2>
            <p class="parrafo-mapa">
                Visitanos en nuestra tienda física en Avenida Belgrano 1436, Buenos Aires.
            </p>
            <iframe
                src="https://maps.google.com/maps?q=Avenida%20Belgrano%201436%2C%20Buenos%20Aires&t=&z=16&ie=UTF8&iwloc=&output=embed"
                allowfullscreen=""
                loading="lazy"
                title="Ubicación de TechStore en Avenida Belgrano 1436">
            </iframe>
        </section>
    </main>

    <footer>
        <p>Sitio realizado por Olenka Levano para Talento Tech</p>
        <nav>
            <ul class="footer-list">
                <li>
                    <img src="../img/whatsapp.png" alt="logo whatsapp" />
                    <img src="../img/instagram.png" alt="logo instagram" />
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
